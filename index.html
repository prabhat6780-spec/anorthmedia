  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('app-theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector("meta[name='theme-color']").setAttribute('content', '#4A0F14');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="preload">
  <script>
    // Prevent CSS transitions from firing on initial load
    setTimeout(function () {
      document.body.classList.remove('preload');
    }, 100);
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
